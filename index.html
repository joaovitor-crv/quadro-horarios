<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Horários Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: ferramenta de trabalho da coordenação — sóbria, densa, precisa
   IDEA: o quadro de horários de cortiça da sala dos professores, com fichas coloridas por disciplina
   PICTURE: a própria grade semanal, grande, com as fichas de aula que se arrastam
   COLOUR and TYPE: tinta azul-escola #1f3a68, papel branco, fichas nas cores das disciplinas, acento coral; Archivo + Inter
   LAYOUT: barra lateral de módulos, área de trabalho larga; no celular, barra superior e grade com rolagem lateral */
:root{color-scheme:light dark;--disp:Archivo,Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--bg:light-dark(#eef1f6,#11151d);--panel:light-dark(#ffffff,#1a202b);--panel2:light-dark(#f6f8fb,#202837);--ink:light-dark(#18202e,#e7ebf2);--muted:light-dark(#5b6576,#9aa5b8);
--line:light-dark(#dde2ea,#2c3546);--brand:light-dark(#1f3a68,#9db8ec);--brand-ink:light-dark(#ffffff,#0f1828);--brand-bg:light-dark(#1f3a68,#2a4a82);--accent:light-dark(#e2553f,#ff8a73);
--ok:light-dark(#18805b,#59d3a2);--warn:light-dark(#b7791f,#f2c46b);--bad:light-dark(#c53030,#ff7b7b);--sel:light-dark(#ffe7a3,#5b4a16)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:var(--disp);line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(24px,3vw,32px);font-weight:800;text-wrap:balance}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--brand-bg);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo svg{flex:none}
.logo b{font-family:var(--disp);font-size:16px;line-height:1.1;display:block}
.logo small{opacity:.75;font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#fff;text-decoration:none;opacity:.82;font-weight:500;min-height:42px}
nav a:hover{background:rgba(255,255,255,.08);opacity:1}
nav a.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
nav a .n{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
nav .sep{font-size:11px;opacity:.6;padding:12px 12px 4px}
.save{margin-top:auto;font-size:12px;opacity:.85;padding:10px 12px;border-top:1px solid rgba(255,255,255,.15)}
.save i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7ee2b8;margin-right:6px}
.save.pend i{background:#ffd166}.save.err i{background:#ff7b7b}
main{padding:22px clamp(14px,2.4vw,32px) 60px;max-width:1500px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top p{margin:6px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{padding:14px 16px}
.kpi small{color:var(--muted);font-size:13px;display:block}
.kpi b{font-family:var(--disp);font-size:30px;line-height:1.1;display:block;margin-top:4px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand-bg);border-color:var(--brand-bg);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:40px;font-size:15px}
input[type=number]{width:80px}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select{color:var(--ink)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel);max-height:70vh}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}

.tag.bad{color:var(--bad);border-color:currentColor}.tag.ok{color:var(--ok);border-color:currentColor}.tag.warn{color:var(--warn);border-color:currentColor}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.muted{color:var(--muted)}
.bar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.full{background:var(--ok)}
.hint{font-size:13px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* grade */
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
.sched{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed;min-width:640px}
.sched th{background:transparent;border:0;text-align:center;font-family:var(--disp);font-size:14px;color:var(--ink);position:static;padding:4px}
.sched td{border:0;padding:0;height:62px}
.sched td.h{width:74px;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;line-height:1.15}
.sched td.h b{display:block;color:var(--ink);font-size:14px}
.cell{height:100%;min-height:58px;border-radius:10px;border:1.5px dashed var(--line);background:var(--panel);display:flex;flex-direction:column;justify-content:center;padding:6px 8px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.cell.fill{border:0;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.cell .d{font-weight:700;font-size:13.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .p{font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.off{background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,transparent 6px 12px);cursor:not-allowed;border-style:solid}
.cell.na{background:repeating-linear-gradient(-45deg,light-dark(#fde8e8,#3a1f22) 0 6px,transparent 6px 12px)}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell.conf{outline:3px solid var(--bad);outline-offset:1px}
.cell.conf::after{content:"!";position:absolute;top:4px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.cell .pin{position:absolute;bottom:3px;right:6px;font-size:11px;opacity:.9}
.cell.drop{transform:scale(1.03);outline:3px dashed var(--brand)}
.cell.flash{animation:fl 1.2s 2}
@keyframes fl{50%{outline:4px solid var(--accent)}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}.cell.flash{animation:none;outline:4px solid var(--accent)}}
.sched tr.ivr td{height:auto}
.intv{text-align:center;font-size:12px;font-weight:600;color:var(--muted);background:repeating-linear-gradient(90deg,var(--panel2) 0 10px,transparent 10px 14px);border-radius:8px;padding:3px}
.tray .it{display:flex;gap:8px;align-items:center;padding:8px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;background:var(--panel);cursor:grab}
.tray .it:active{cursor:grabbing}
.tray .it .c{width:10px;align-self:stretch;border-radius:5px}
.tray .it b{font-size:13.5px;display:block;line-height:1.2}
.tray .it small{color:var(--muted);font-size:12px}
.tray .it .q{margin-left:auto;font-family:var(--disp);font-weight:800;font-size:18px}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer;min-height:36px}
.tabs button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.geral{border-collapse:separate;border-spacing:2px;font-size:11.5px}
.geral th{position:sticky;top:0;background:var(--panel);font-size:11px;padding:4px;text-align:center;z-index:2}
.geral th.t{left:0;z-index:3;text-align:left}
.geral td{border:0;padding:0;min-width:46px;height:34px}
.geral td.t{position:sticky;left:0;background:var(--panel);font-weight:600;padding:0 8px;white-space:nowrap;z-index:1;font-size:12.5px}
.geral .g{display:flex;flex-direction:column;justify-content:center;height:100%;border-radius:6px;color:#fff;padding:2px 4px;line-height:1.1;cursor:pointer;text-align:center}
.geral .g small{font-size:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.geral .g.v{background:var(--panel2);color:var(--muted)}
.geral .g.conf{outline:2px solid var(--bad)}
.geral th.dsep,.geral td.dsep{border-left:3px solid var(--line)}
/* gaveta */
.ov{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:50;display:flex;justify-content:flex-end}
.ov[hidden]{display:none!important}
[hidden]{display:none!important}
.drawer{background:var(--panel);width:min(560px,100%);height:100%;overflow:auto;padding:22px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer.wide{width:min(980px,100%)}
.modal{margin:auto;background:var(--panel);border-radius:16px;width:min(520px,94vw);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ov.center{justify-content:center;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18202e;color:#fff;padding:12px 18px;border-radius:12px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw}
.opts{display:grid;gap:6px;max-height:55vh;overflow:auto}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel);text-align:left;width:100%}
.opt:hover{border-color:var(--brand)}
.opt.no{opacity:.5}
.opt small{color:var(--muted);display:block;font-size:12px}
.av{display:grid;gap:3px}
.av button{border:1px solid var(--line);border-radius:6px;min-height:30px;background:var(--panel);cursor:pointer;font-size:12px}
.av button.x{background:repeating-linear-gradient(45deg,light-dark(#f6c9c9,#5a2a2a) 0 5px,light-dark(#fde8e8,#3a1f22) 5px 10px);color:var(--bad);font-weight:700}
.prob{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.prob .s{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.steps{counter-reset:s;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13px;flex:none}
.steps li.ok::before{content:"✓";background:var(--ok);color:#fff;border-color:var(--ok)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.prog{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.mob{display:none}
@media(max-width:1100px){.gwrap{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 10px;gap:6px}
 .logo{padding:0}.logo small{display:none}
 nav{display:none;width:100%}
 aside.open nav{display:block}
 .mob{display:inline-flex;margin-left:auto;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:9px;padding:8px 12px;font-weight:600;min-height:40px}
 .save{margin:0;border:0;padding:4px 0;width:100%}
}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 10px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8em;white-space:normal;color:var(--muted);font-size:12px}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<script>
/* ===== Núcleo: utilidades, xlsx (ler/escrever), pdf, importação, gerador, validação ===== */
const U = {
  uid: (p = 'x') => p + Math.random().toString(36).slice(2, 9),
  norm: s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(),

  title(s) {
    const low = ['de', 'da', 'do', 'das', 'dos', 'e', 'em', 'para', 'a', 'o', 'ao', 'na', 'no'];
    return String(s).toLowerCase().split(/\s+/).map((w, i) => (i && low.includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
      .replace(/\b(Ii|Iii|Iv|Mei|Html|Css|Php|Java|Sql|Mysql|Web|Poo|P\.o\.o|Pics|Ec|Aec|Eja)\b/g, m => m.toUpperCase());

  sigla(nome) {

  /* CSV: professor;disciplina;turma;turno;aulas */

/* ---------- Estado ---------- */
const Store = {
  vazio(cfg) {
    return {
      config: cfg ? JSON.parse(JSON.stringify(cfg)) : {
        escola: 'Escola Estadual Sérgio de Freitas Pacheco', ano: 2026,
        dias: ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'],
        turnos: {
          M: { nome: 'Matutino', horarios: ['06:55', '07:45', '08:35', '09:45', '10:33', '11:21', '13:10'], intervalos: [{ ini: '09:25', fim: '09:45', nome: 'Recreio' }, { ini: '12:10', fim: '13:10', nome: 'Almoço (EMTI)' }] },
          V: { nome: 'Vespertino', horarios: ['13:10', '14:00', '14:50', '15:55', '16:45'], intervalos: [{ ini: '15:40', fim: '15:55', nome: 'Recreio' }] },
          N: { nome: 'Noturno', horarios: ['19:00', '19:50', '21:00', '21:50'], intervalos: [{ ini: '20:40', fim: '21:00', nome: 'Recreio' }] }

/* ---------- Modelo: índices e consultas ---------- */
function Modelo(st) {
  const M = { st };
  M.prof = Object.fromEntries(st.professores.map(p => [p.id, p]));
  M.turma = Object.fromEntries(st.turmas.map(t => [t.id, t]));
  M.disc = Object.fromEntries(st.disciplinas.map(d => [d.id, d]));
  M.atr = Object.fromEntries(st.atribs.map(a => [a.id, a]));
  M.dias = st.config.dias.length;
  M.diasT = t => Math.max(1, Math.min(t.dias || M.dias, M.dias));
  M.hor = (t, a) => (st.config.turnos[t.turno]?.horarios || [])[a] || ('Aula ' + (a + 1));
  M.chaveTempo = (t, d, a) => d + '|' + M.hor(t, a);
  M.indisp = Object.fromEntries(st.professores.map(p => [p.id, new Set(p.indisp || [])]));
  M.regras = ((st.config && st.config.regras) || []).filter(r => r.ativo !== false && M.prof[r.prof]);
  M.maxDia = {};
  for (const r of M.regras) {
    if (r.tipo === 'nao' || r.tipo === 'dias') {
      const bloq = r.tipo === 'nao' ? r.dias : st.config.dias.map((x, i) => i).filter(i => !r.dias.includes(i));
      for (const d of bloq) for (const tu of Object.values(st.config.turnos)) for (const h of tu.horarios) M.indisp[r.prof].add(d + '|' + h);
    }
    if (r.tipo === 'max') M.maxDia[r.prof] = Math.min(M.maxDia[r.prof] ?? 99, r.n);
  }
  M.cells = function* () { for (const t of st.turmas) { const g = st.grade[t.id] || {}; for (const [k, aid] of Object.entries(g)) { const [d, a] = k.split('-').map(Number); yield { t, d, a, aid, at: M.atr[aid] }; } } };
  M.contagem = () => { const c = {}; for (const x of M.cells()) if (x.at) c[x.aid] = (c[x.aid] || 0) + 1; return c; };
  return M;
}

/* ---------- Pedidos dos professores (regras) ---------- */
const Regras = {
  TIPOS: { seq: 'Aulas seguidas no dia', min: 'Aulas no dia (mínimo)', dias: 'Só dá aula nestes dias', nao: 'Não dá aula nestes dias', max: 'Máximo de aulas por dia' },
  descreve(r, st) {
    const p = (st.professores.find(x => x.id === r.prof) || {}).nome || '?', D = st.config.dias, ds = (r.dias || []).map(i => D[i] || '?');
    const lista = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1] : a[0] || '?';
    if (r.tipo === 'seq') return `${p}: ${r.n} aulas seguidas na ${ds[0]}`;
    if (r.tipo === 'min') return `${p}: pelo menos ${r.n} aula${r.n > 1 ? 's' : ''} na ${ds[0]}`;
    if (r.tipo === 'dias') return `${p}: só dá aula ${lista(ds.map(x => 'na ' + x))}`;
    if (r.tipo === 'nao') return `${p}: não dá aula ${lista(ds.map(x => 'na ' + x))}`;
    if (r.tipo === 'max') return `${p}: no máximo ${r.n} aulas por dia`;
    return p;
  },
  /* uma linha de texto -> [{prof, tipo, dias, n}] ou {erro, candidatos} */
  interpretar(txt, st) {
    const t = ' ' + U.norm(txt).replace(/[.,;:!?()]/g, ' ') + ' ';
    const nomesDias = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
    const dias = []; for (const m of t.matchAll(/\b(segunda|terca|quarta|quinta|sexta|sabado)(-feira|s)?\b/g)) { const i = nomesDias.indexOf(m[1]); if (i < st.config.dias.length && !dias.includes(i)) dias.push(i); }
    const pal = { um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7 };
    const nm = /\b(\d{1,2}|uma?|dois|duas|tres|quatro|cinco|seis|sete)\s+aulas?\b/.exec(t) || /\b(\d{1,2})\b/.exec(t);
    const n = nm ? (pal[nm[1]] || parseInt(nm[1], 10)) : null;
    // professor
    const skip = ['de', 'da', 'do', 'das', 'dos', 'e'];
    const sc = st.professores.map(p => { const tk = U.norm(p.nome).split(' ').filter(w => w.length > 1 && !skip.includes(w)); const hit = tk.filter(w => t.includes(' ' + w + ' ')); return { p, hit: hit.length, first: t.includes(' ' + tk[0] + ' ') }; }).filter(x => x.hit > 0);
    const melhor = Math.max(0, ...sc.map(x => x.hit + (x.first ? 0.5 : 0)));
    const cands = sc.filter(x => x.hit + (x.first ? 0.5 : 0) === melhor).map(x => x.p);
    let tipo = null;
    if (/\b(no maximo|maximo|nao mais (de|que)|ate)\s+(\d{1,2}|uma?|dois|duas|tres|quatro|cinco|seis|sete)\s+aulas?\b/.test(t) || /\bmais (de|que) \d+ aulas?\b/.test(t)) tipo = 'max';
    else if (/(seguid|sequenc|sequencia|consecutiv|geminad|emendad|em bloco|juntas|direto|corrid)/.test(t)) tipo = 'seq';
    else if (/\b(nao|sem aula|folga|livre|nenhuma aula|exceto|menos)\b/.test(t)) tipo = 'nao';
    else if (/\b(so|somente|apenas|unicamente)\b/.test(t)) tipo = 'dias';
    else if (dias.length) tipo = 'min';
    const r = { prof: cands.length === 1 ? cands[0].id : '', tipo, dias, n, texto: String(txt).trim() };
    if (/mais (de|que) (\d+)/.test(t) && tipo === 'max') r.n = parseInt(/mais (de|que) (\d+)/.exec(t)[2], 10);
    const avisos = [];
    if (!cands.length) avisos.push('Não reconheci o professor.');
    if (cands.length > 1) avisos.push('Mais de um professor combina: ' + cands.map(p => p.nome).join(', ') + '. Escolha o certo.');
    if (!tipo) avisos.push('Não entendi o tipo de pedido. Escolha abaixo.');
    if ((tipo === 'seq' || tipo === 'min' || tipo === 'dias' || tipo === 'nao') && !dias.length) avisos.push('Não encontrei o dia da semana.');
    if ((tipo === 'seq' || tipo === 'max') && !n) avisos.push('Não encontrei a quantidade de aulas.');
    if (tipo === 'min' && !r.n) r.n = 1;
    if (tipo === 'seq' && r.n === 1) avisos.push('Uma aula só não forma sequência; confira a quantidade.');
    // seq/min com vários dias vira uma regra por dia
    const regras = (tipo === 'seq' || tipo === 'min') && dias.length > 1 ? dias.map(d => ({ ...r, dias: [d] })) : [r];
    return { regras, avisos, candidatos: cands.map(p => p.id) };
  },
  /* situação de cada regra na grade atual */
  checar(st) {
    const M = Modelo(st), out = [];
    for (const r of M.regras) {
      const mine = []; for (const x of M.cells()) if (x.at && x.at.prof === r.prof) mine.push(x);
      let ok = true, det = '';
      if (r.tipo === 'seq') {
        const d = r.dias[0]; let best = 0;
        for (const tu of Object.keys(st.config.turnos)) { const idx = [...new Set(mine.filter(x => x.d === d && x.t.turno === tu).map(x => st.config.turnos[tu].horarios.indexOf(M.hor(x.t, x.a))))].sort((a, b) => a - b); let run = 0, prev = -9; for (const i of idx) { run = i === prev + 1 ? run + 1 : 1; prev = i; best = Math.max(best, run); } }

      } else if (r.tipo === 'min') { const c = mine.filter(x => x.d === r.dias[0]).length; ok = c >= r.n; det = `${c} aula(s) na ${st.config.dias[r.dias[0]]}`; }
      else if (r.tipo === 'max') { const por = {}; mine.forEach(x => por[x.d] = (por[x.d] || 0) + 1); const mx = Math.max(0, ...Object.values(por)); ok = mx <= r.n; det = `máximo atual: ${mx} por dia`; }
      else { const bloq = r.tipo === 'nao' ? r.dias : st.config.dias.map((x, i) => i).filter(i => !r.dias.includes(i)); const c = mine.filter(x => bloq.includes(x.d)).length; ok = c === 0; det = c ? `${c} aula(s) em dia não permitido` : 'nenhuma aula em dia não permitido'; }
      out.push({ id: r.id, ok, det, txt: Regras.descreve(r, st) });
    }
    return out;
  }
};

/* ---------- Validação ---------- */
function validar(st) {
  const M = Modelo(st), probs = [], cont = M.contagem();
  const ocup = {};
  for (const x of M.cells()) {
    if (!x.at) { probs.push({ tipo: 'orfa', grav: 2, msg: `Aula sem atribuição válida em ${x.t.nome}`, turma: x.t.id, d: x.d, a: x.a }); continue; }
    if (x.a >= x.t.aulasDia || x.d >= M.diasT(x.t)) probs.push({ tipo: 'fora', grav: 2, msg: `${x.t.nome}: aula fora do horário da turma (${st.config.dias[x.d] || 'dia ' + (x.d + 1)}, ${x.a + 1}ª aula)`, turma: x.t.id, d: x.d, a: x.a });
    if (!x.at.prof) continue;
    const k = x.at.prof + '@' + M.chaveTempo(x.t, x.d, x.a);
    (ocup[k] ||= []).push(x);
    if (M.indisp[x.at.prof]?.has(M.chaveTempo(x.t, x.d, x.a))) probs.push({ tipo: 'indisp', grav: 2, msg: `${M.prof[x.at.prof]?.nome}: aula em horário indisponível (${st.config.dias[x.d]}, ${M.hor(x.t, x.a)}) em ${x.t.nome}`, turma: x.t.id, d: x.d, a: x.a, prof: x.at.prof });
  }
  for (const [k, arr] of Object.entries(ocup)) if (arr.length > 1) {
    const p = M.prof[arr[0].at.prof];
    probs.push({ tipo: 'choque', grav: 3, msg: `${p?.nome || 'Professor'} em ${arr.length} turmas no mesmo horário (${st.config.dias[arr[0].d]}, ${M.hor(arr[0].t, arr[0].a)}): ${arr.map(x => x.t.nome).join(', ')}`, turma: arr[0].t.id, d: arr[0].d, a: arr[0].a, prof: arr[0].at.prof, cells: arr.map(x => [x.t.id, x.d, x.a]) });
  }
  for (const a of st.atribs) {
    const n = cont[a.id] || 0, t = M.turma[a.turma], d = M.disc[a.disc];
    if (!t || !d) continue;
    if (!a.prof) probs.push({ tipo: 'semprof', grav: 1, msg: `${d.nome} em ${t.nome}: ${a.aulas} aula(s) sem professor definido`, turma: t.id, atr: a.id });
    if (n < a.aulas && a.prof) probs.push({ tipo: 'falta', grav: 1, msg: `${d.nome} em ${t.nome} (${M.prof[a.prof]?.nome}): ${n} de ${a.aulas} aulas distribuídas — faltam ${a.aulas - n}`, turma: t.id, atr: a.id, prof: a.prof });
    if (n > a.aulas) probs.push({ tipo: 'excesso', grav: 2, msg: `${d.nome} em ${t.nome}: ${n} aulas na grade, previstas ${a.aulas}`, turma: t.id, atr: a.id });
  }
  for (const p of st.professores) {
    const prevista = p.carga ?? st.atribs.filter(a => a.prof === p.id).reduce((s, a) => s + a.aulas, 0);
    const naGrade = st.atribs.filter(a => a.prof === p.id).reduce((s, a) => s + (cont[a.id] || 0), 0);
    const atribuida = st.atribs.filter(a => a.prof === p.id).reduce((s, a) => s + a.aulas, 0);
    if (atribuida !== prevista) probs.push({ tipo: 'carga', grav: 1, msg: `${p.nome}: carga prevista ${prevista}, atribuída ${atribuida} (${atribuida > prevista ? 'acima' : 'abaixo'} do previsto)`, prof: p.id });
    if (naGrade > prevista) probs.push({ tipo: 'carga', grav: 2, msg: `${p.nome}: ${naGrade} aulas na grade, acima da carga prevista (${prevista})`, prof: p.id });
  }
  if (Object.keys(ocup).length) for (const r of Regras.checar(st)) if (!r.ok) { const rg = M.regras.find(x => x.id === r.id); probs.push({ tipo: 'regra', grav: 2, msg: `Pedido não atendido — ${r.txt} (${r.det})`, prof: rg && rg.prof, regra: r.id }); }
  for (const t of st.turmas) {
    const dem = st.atribs.filter(a => a.turma === t.id).reduce((s, a) => s + a.aulas, 0), cap = t.aulasDia * M.diasT(t);
    const demP = st.atribs.filter(a => a.turma === t.id && a.prof).reduce((s, a) => s + a.aulas, 0);
    if (dem > cap) probs.push(demP <= cap ? { tipo: 'capacidade', grav: 1, msg: `${t.nome}: ${dem} aulas previstas para ${cap} horários — as ${dem - demP} aula(s) sem professor não cabem na grade`, turma: t.id } : { tipo: 'capacidade', grav: 3, msg: `${t.nome}: ${dem} aulas previstas para ${cap} horários (${t.aulasDia} por dia) — aumente as aulas por dia`, turma: t.id });
  }
  return probs;
}

/* ---------- Gerador automático ---------- */
const Gerador = {
  /* opções: {manterFixas, manterTudo, tempoMs, onProgress} ; devolve Promise<{grade, naoAlocadas, custo, tentativas}> */
  async gerar(st, opt = {}) {
    const M = Modelo(st), D = M.dias, T = st.turmas, prefs = st.config.prefs || {};

    const rnd = (() => { let s = opt.seed || (Date.now() % 2147483647); return () => (s = s * 16807 % 2147483647) / 2147483647; })();
    // base: aulas mantidas
    const base = {};
    for (const t of T) {
      base[t.id] = {};
      const g = st.grade[t.id] || {};
      for (const [k, aid] of Object.entries(g)) { const [d0, a0] = k.split('-').map(Number); if (a0 >= t.aulasDia || d0 >= M.diasT(t)) continue; if (M.atr[aid] && (opt.manterTudo || (opt.manterFixas && st.fixas[t.id + '|' + k]))) base[t.id][k] = aid; }
    }
    const jaTem = {}; for (const t of T) for (const aid of Object.values(base[t.id])) jaTem[aid] = (jaTem[aid] || 0) + 1;
    const unidades = [];
    for (const a of st.atribs) { if (!a.prof || !M.turma[a.turma] || !M.prof[a.prof]) continue; const n = Math.max(0, a.aulas - (jaTem[a.id] || 0)); for (let i = 0; i < n; i++) unidades.push(a); }
    // dificuldade
    const cargaProf = {}; st.atribs.forEach(a => { if (a.prof) cargaProf[a.prof] = (cargaProf[a.prof] || 0) + a.aulas; });
    const dispProf = {}; for (const p of st.professores) dispProf[p.id] = (p.indisp || []).length;
    const dificuldade = a => cargaProf[a.prof] * 2 + dispProf[a.prof] * 3 + a.aulas + (M.turma[a.turma].aulasDia * M.diasT(M.turma[a.turma]) - st.atribs.filter(x => x.turma === a.turma).reduce((s, x) => s + x.aulas, 0) < 3 ? 15 : 0);

    function tentativa() {
      const grade = {}, profOc = {}, discDia = {}, turmaDia = {}, profDia = {}, profTot = {};
      const put = (t, d, a, at) => {
        (grade[t.id] ||= {})[d + '-' + a] = at.id;
        profOc[at.prof + '@' + M.chaveTempo(t, d, a)] = t.id + '|' + d + '-' + a;
        discDia[at.id + '|' + d] = (discDia[at.id + '|' + d] || 0) + 1;
        turmaDia[t.id + '|' + d] = (turmaDia[t.id + '|' + d] || 0) + 1;
        (profDia[at.prof + '|' + t.turno + '|' + d] ||= []).push(a);
        profTot[at.prof + '|' + d] = (profTot[at.prof + '|' + d] || 0) + 1;
      };
      const del = (t, d, a) => {
        const aid = grade[t.id][d + '-' + a], at = M.atr[aid]; delete grade[t.id][d + '-' + a];
        delete profOc[at.prof + '@' + M.chaveTempo(t, d, a)];
        discDia[at.id + '|' + d]--; turmaDia[t.id + '|' + d]--;
        const L = profDia[at.prof + '|' + t.turno + '|' + d]; L.splice(L.indexOf(a), 1); profTot[at.prof + '|' + d]--; return at;
      };
      for (const t of T) for (const [k, aid] of Object.entries(base[t.id])) { const [d, a] = k.split('-').map(Number); put(t, d, a, M.atr[aid]); }
      const livre = (t, d, a) => !(grade[t.id] && grade[t.id][d + '-' + a]);
      const pode = (t, d, a, at) => a < t.aulasDia && livre(t, d, a) && !profOc[at.prof + '@' + M.chaveTempo(t, d, a)] && !M.indisp[at.prof].has(M.chaveTempo(t, d, a)) && (M.maxDia[at.prof] == null || (profTot[at.prof + '|' + d] || 0) < M.maxDia[at.prof]);
      const custo = (t, d, a, at) => {
        let c = 0;
        const n = discDia[at.id + '|' + d] || 0;
        if (n >= 1) {
          const adj = (grade[t.id] || {})[d + '-' + (a - 1)] === at.id || (grade[t.id] || {})[d + '-' + (a + 1)] === at.id;
          c += (prefs.permitirDupla !== false && n === 1 && adj) ? 6 : 40 * n;
          if (n + 1 > (prefs.maxMesmaDiscDia || 2)) c += 200;
        }
        c += 2 * (turmaDia[t.id + '|' + d] || 0);
        const L = profDia[at.prof + '|' + t.turno + '|' + d] || [];
        if (L.length) { const mn = Math.min(...L), mx = Math.max(...L); if (a < mn - 1) c += 4 * (mn - a - 1); else if (a > mx + 1) c += 4 * (a - mx - 1); else if (a >= mn && a <= mx) c -= 1; c += 0.5 * L.length; }
        else c += 1.5;
        const dem = st.atribs.filter(x => x.turma === t.id).reduce((s, x) => s + x.aulas, 0), cap = t.aulasDia * M.diasT(t);
        if (dem < cap) c += a * 0.6; // deixa as sobras no fim do dia
        return c + rnd() * 1.2;
      };
      // pedidos dos professores: aulas seguidas / mínimo no dia são colocadas antes das demais
      const rest = {}, consumido = {}, regrasFalhas = [];
      for (const a of unidades) rest[a.id] = (rest[a.id] || 0) + 1;
      const usa = a => { rest[a.id]--; consumido[a.id] = (consumido[a.id] || 0) + 1; };
      const devolve = a => { rest[a.id]++; consumido[a.id]--; };
      const emb = arr => arr.map(x => [rnd(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
      for (const r of emb(M.regras.filter(r => r.tipo === 'seq' || r.tipo === 'min'))) {
        const p = r.prof, d = r.dias[0], ats = st.atribs.filter(a => a.prof === p && M.turma[a.turma]);
        if (d == null || d >= D) { regrasFalhas.push(r.id); continue; }
        let ok = false;
        if (r.tipo === 'seq') {
          for (const tu of emb([...new Set(ats.map(a => M.turma[a.turma].turno))])) {
            const H = st.config.turnos[tu].horarios;
            for (const s0 of emb([...Array(Math.max(0, H.length - r.n + 1)).keys()])) {
              const feitos = []; let bom = true;
              for (let k = s0; k < s0 + r.n; k++) {

                let best = null, bc = Infinity;

                if (!best) { bom = false; break; }
                put(best[0], d, k, best[1]); usa(best[1]); feitos.push([best[0], k, best[1]]);
              }
              if (bom) { ok = true; break; }
              for (const [t, k, a] of feitos) { del(t, d, k); devolve(a); }
            }
            if (ok) break;
          }
        } else {
          let falta = r.n - (profTot[p + '|' + d] || 0);
          while (falta > 0) {
            let best = null, bc = Infinity;
            for (const a of ats) { if (!(rest[a.id] > 0)) continue; const t = M.turma[a.turma]; if (d >= M.diasT(t)) continue; for (let k = 0; k < t.aulasDia; k++) if (pode(t, d, k, a)) { const c = custo(t, d, k, a); if (c < bc) { bc = c; best = [t, k, a]; } } }
            if (!best) break;
            put(best[0], d, best[1], best[2]); usa(best[2]); falta--;
          }
          ok = falta <= 0;
        }
        if (!ok) regrasFalhas.push(r.id);
      }
      const ord = unidades.slice().sort((x, y) => (dificuldade(y) - dificuldade(x)) || (rnd() - 0.5));
      const falhas = [];
      for (const at of ord) {
        if (consumido[at.id] > 0) { consumido[at.id]--; continue; }
        const t = M.turma[at.turma]; let best = null, bc = Infinity;
        for (let d = 0; d < M.diasT(t); d++) for (let a = 0; a < t.aulasDia; a++) if (pode(t, d, a, at)) { const c = custo(t, d, a, at); if (c < bc) { bc = c; best = [d, a]; } }
        if (best) { put(t, best[0], best[1], at); continue; }
        // reparo: liberar uma célula movendo uma aula que bloqueia
        let ok = false;
        const cand = [];
        for (let d = 0; d < M.diasT(t); d++) for (let a = 0; a < t.aulasDia; a++) cand.push([d, a]);
        cand.sort(() => rnd() - 0.5);
        for (const [d, a] of cand) {
          if (M.indisp[at.prof].has(M.chaveTempo(t, d, a))) continue;
          const kTempo = at.prof + '@' + M.chaveTempo(t, d, a);
          const bloqT = !livre(t, d, a) ? [t, d, a] : null;
          const bloqP = profOc[kTempo] ? profOc[kTempo].split('|') : null;
          if ((bloqT && bloqP) || (!bloqT && !bloqP)) continue;
          let tb, db, ab;
          if (bloqT) [tb, db, ab] = bloqT; else { tb = M.turma[bloqP[0]]; [db, ab] = bloqP[1].split('-').map(Number); }
          if (base[tb.id][db + '-' + ab]) continue;
          const mov = del(tb, db, ab);
          let dest = null, dc = Infinity;
          for (let d2 = 0; d2 < M.diasT(tb); d2++) for (let a2 = 0; a2 < tb.aulasDia; a2++) {
            if (d2 === db && a2 === ab) continue;
            if (pode(tb, d2, a2, mov)) { const c = custo(tb, d2, a2, mov); if (c < dc) { dc = c; dest = [d2, a2]; } }
          }
          if (dest) { put(tb, dest[0], dest[1], mov); if (pode(t, d, a, at)) { put(t, d, a, at); ok = true; break; } del(tb, dest[0], dest[1]); }
          put(tb, db, ab, mov);
        }
        if (!ok) falhas.push(at);
      }
      // melhoria local: trocas dentro da turma

        let c = 0;
        for (const [k, n] of Object.entries(discDia)) if (n > 1) { c += 30 * (n - 1); if (n > (prefs.maxMesmaDiscDia || 2)) c += 200; }
        for (const L of Object.values(profDia)) if (L.length > 1) { const mn = Math.min(...L), mx = Math.max(...L); c += 4 * (mx - mn + 1 - L.length); }
        return c;
      };
      // reduz repetições: tenta trocar aulas duplicadas no mesmo dia
      for (let it = 0; it < 2; it++) for (const t of T) {
        const g = grade[t.id] || {};
        for (const [k, aid] of Object.entries(g)) {
          const [d, a] = k.split('-').map(Number); if (base[t.id][k]) continue;
          if ((discDia[aid + '|' + d] || 0) < 2) continue;
          const adj = g[d + '-' + (a - 1)] === aid || g[d + '-' + (a + 1)] === aid;
          if (adj && prefs.permitirDupla !== false && discDia[aid + '|' + d] === 2) continue;
          const at = M.atr[aid]; let feito = false;
          for (let d2 = 0; d2 < M.diasT(t) && !feito; d2++) for (let a2 = 0; a2 < t.aulasDia && !feito; a2++) {
            if (d2 === d || (discDia[aid + '|' + d2] || 0) > 0 || base[t.id][d2 + '-' + a2]) continue;
            const other = g[d2 + '-' + a2];
            if (!other) { del(t, d, a); if (pode(t, d2, a2, at)) { put(t, d2, a2, at); feito = true; } else put(t, d, a, at); continue; }
            const ot = M.atr[other]; if ((discDia[other + '|' + d] || 0) > 0) continue;

            if (pode(t, d2, a2, at)) { put(t, d2, a2, at); if (pode(t, d, a, ot)) { put(t, d, a, ot); feito = true; } else { del(t, d2, a2); put(t, d, a, at); put(t, d2, a2, ot); } }

    }
    let best = null, n = 0;
    do {

      if (opt.onProgress) await opt.onProgress(n, best, Date.now() - ini, tempo);

    const naoAlocadas = [];
    const agrup = {}; best.falhas.forEach(at => agrup[at.id] = (agrup[at.id] || 0) + 1);
    for (const [aid, qtd] of Object.entries(agrup)) naoAlocadas.push({ atr: aid, qtd, motivo: Gerador.motivo(st, best.grade, M.atr[aid]) });
    return { grade: best.grade, naoAlocadas, custo: best.custo, tentativas: n };
  },
  motivo(st, grade, at) {
    const M = Modelo({ ...st, grade }), t = M.turma[at.turma], p = M.prof[at.prof], D = M.dias;
    const livresT = []; for (let d = 0; d < M.diasT(t); d++) for (let a = 0; a < t.aulasDia; a++) if (!(grade[t.id] || {})[d + '-' + a]) livresT.push([d, a]);

    if (dem > cap) return `A turma ${t.nome} tem ${dem} aulas previstas para apenas ${cap} horários (${t.aulasDia} por dia).`;
    const ocupado = new Set(); for (const x of M.cells()) if (x.at && x.at.prof === p.id) ocupado.add(M.chaveTempo(x.t, x.d, x.a));
    const indisp = M.indisp[p.id];
    const comum = livresT.filter(([d, a]) => !ocupado.has(M.chaveTempo(t, d, a)) && !indisp.has(M.chaveTempo(t, d, a)));
    const horariosTurno = []; for (let d = 0; d < M.diasT(t); d++) for (let a = 0; a < t.aulasDia; a++) horariosTurno.push(M.chaveTempo(t, d, a));

    if (M.maxDia[p.id] != null && totP > M.maxDia[p.id] * D) return `O pedido “no máximo ${M.maxDia[p.id]} aulas por dia” deixa ${p.nome} com ${M.maxDia[p.id] * D} horários na semana, mas ele(a) tem ${totP} aulas. Aumente o máximo ou redistribua aulas.`;
    if (cargaNoTurno > dispNoTurno) return `${p.nome} tem ${cargaNoTurno} aulas no turno ${st.config.turnos[t.turno].nome.toLowerCase()}, mas só ${dispNoTurno} horários disponíveis nesse turno.`;
    if (!livresT.length) return `A grade de ${t.nome} está cheia.`;
    if (!comum.length) {
      const porIndisp = livresT.filter(([d, a]) => indisp.has(M.chaveTempo(t, d, a))).length;
      return `Os ${livresT.length} horários que sobraram em ${t.nome} coincidem com horários em que ${p.nome} já está em outra turma${porIndisp ? ` ou indisponível (${porIndisp})` : ''}. Troque manualmente uma aula de ${p.nome} ou da turma para abrir espaço.`;
    }
    return `Restaram horários compatíveis, mas as regras de repetição da disciplina no dia impediram a alocação. Coloque manualmente na grade.`;
  }
};

if (typeof module !== 'undefined' && module.exports) module.exports = { U, Zip, XLSX, PDF, Importer, Store, Modelo, validar, Gerador, Regras };

{

VIEWS.importar.after = () => {
  const dz = $('main'); dz.ondragover = e => { e.preventDefault(); }; dz.ondrop = e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) lerArquivo(f); };
  $('main').querySelectorAll('[data-imp]').forEach(el => el.onchange = () => {
    const pr = UI.import.prop, i = +el.dataset.i, k = el.dataset.imp;
    if (k === 'dup') pr.dups[i].escolha = +el.value;
    else if (k === 'incluir') { pr.turmas[i].incluir = el.checked; render(); }
    else if (k === 'aulasDia') pr.turmas[i].aulasDia = +el.value;
    else pr.turmas[i][k] = el.value;
  });
  const sa = $('impAba'); if (sa) sa.onchange = () => { const s = UI.import.sheets.find(x => x.name === sa.value); const pr = Importer.quadro(s); if (!pr) return toast('Essa aba não tem o formato do quadro de distribuição.'); UI.import.prop = pr; UI.import.aba = s.name; render(); };
};
ACT.escolherArq = () => { $('fileIn').value = ''; $('fileIn').click(); };
$('fileIn').onchange = e => { const f = e.target.files[0]; if (f) lerArquivo(f); };
async function lerArquivo(f) {
  location.hash = '#importar';
  try {
    const nome = f.name, ext = nome.split('.').pop().toLowerCase();
    if (ext === 'json') {
      const o = JSON.parse(await f.text()); if (!o.turmas || !o.atribs) throw new Error('O arquivo .json não é um backup deste sistema.');
      return confirma(`Restaurar o backup <b>${E(nome)}</b>? Os dados atuais serão substituídos (${o.turmas.length} turmas, ${o.professores.length} professores).`, () => { S = o; normaliza(); UI.undo = []; mudou(...DOCS); location.hash = '#painel'; render(); toast('Backup restaurado.'); }, 'Restaurar');
    }
    if (ext === 'csv' || ext === 'txt') { UI.import = { nome, prop: Importer.csv(await f.text()) }; return render(); }
    const sheets = await XLSX.read(await f.arrayBuffer());
    const cands = sheets.map(s => ({ s, pr: Importer.quadro(s) })).filter(x => x.pr);
    if (!cands.length) throw new Error('Não encontrei uma aba com o quadro de distribuição (cabeçalho “PROFESSORES / DISCIPLINA”). Para outros formatos, use o modelo CSV.');
    const best = cands.find(x => x.s.state === 'visible' && x.pr.atr.length) || cands[0];
    UI.import = { nome, sheets: cands.map(x => x.s), abas: cands.map(x => x.s.name), aba: best.s.name, prop: best.pr };
  } catch (e) { UI.import = { erro: e.message || String(e) }; }
  render();
}
ACT.cancelaImp = () => { UI.import = null; render(); };
ACT.confirmaImp = () => {
  const pr = UI.import.prop;

    const novo = Importer.montar(pr, S.config);
    novo.config = S.config; S = novo; normaliza(); UI.undo = []; UI.import = null; UI.turma = null; UI.prof = null;
    mudou(...DOCS); location.hash = '#painel'; render(); toast(`Importado: ${S.turmas.length} turmas, ${S.professores.length} professores, ${S.atribs.length} atribuições.`, 5000);
  };
  if (S.turmas.length) confirma('Substituir os cadastros e a grade atuais pelos dados conferidos?', fazer, 'Substituir e importar', true); else fazer();
};

ACT.salvaProf = d => {
  const nome = $('pNome').value.trim(); if (!nome) return toast('Informe o nome do professor.');
  if (S.professores.some(p => p.id !== d.p && U.norm(p.nome) === U.norm(nome))) return toast('Já existe um professor com esse nome.');

function fichaHtml(aid) { const d = discDe(aid), p = profDe(aid); return d ? `<span class="d">${E(d.nome)}</span><span class="p">${p ? E(nomeCurto(p.nome)) : 'sem professor'}</span>` : '<span class="d">?</span>'; }
function gradeTurma(t) {

  }

function gradeProf(p) {

    out.push({ title: 'Atribuições', head: ['Turma', 'Turno', 'Disciplina', 'Professor', 'Aulas por semana', 'Na grade'], rows: S.atribs.map(a => [M.turma[a.turma]?.nome || '', turnoNome(M.turma[a.turma]?.turno), M.disc[a.disc]?.nome || '', M.prof[a.prof]?.nome || '', a.aulas, cont[a.id] || 0]), sheet: 'Atribuições' });
    const gr = [['Turma', 'Dia', 'Aula', 'Horário', 'Disciplina', 'Professor']];
    for (const t of ordTurmas()) for (let d = 0; d < D.length; d++) for (let a = 0; a < t.aulasDia; a++) { const aid = (S.grade[t.id] || {})[d + '-' + a]; if (aid && M.atr[aid]) gr.push([t.nome, D[d], a + 1, M.hor(t, a), discDe(aid)?.nome || '', profDe(aid)?.nome || '']); }
    out.push({ title: 'Grade (lista)', head: gr[0], rows: gr.slice(1), sheet: 'Grade' });
  }
  return out;
}
const txt = c => c && typeof c === 'object' ? String(c.t ?? '') : String(c ?? '');
function gerarPDF(k, filtro) {
  const doc = new PDF.Doc(k !== 'disc'), agora = new Date().toLocaleString('pt-BR');
  for (const t of relDados(k, filtro)) PDF.table(doc, { ...t, subtitle: t.subtitle || S.config.escola + ' · ' + S.config.ano, right: 'Emitido em ' + agora, footer: S.config.escola + ' — ' + REL[k] });
  return doc.out();
}
function gerarXLS(k, filtro) {
  const tabs = relDados(k, filtro), sheets = [];
  if (k === 'turmas' || k === 'profs') {
    const rows = [], styles = {};
    for (const t of tabs) { styles[rows.length] = 3; rows.push([t.title]); styles[rows.length] = 1; rows.push(t.head); for (const r of t.rows) rows.push(r.map(txt).map(s => s.replace(/\n/g, ' — '))); rows.push([]); }
    sheets.push({ name: k === 'turmas' ? 'Horários por turma' : 'Horários por professor', rows, styles, widths: [16, ...S.config.dias.map(() => 30)] });
    if (!filtro) for (const t of tabs) sheets.push({ name: t.sheet, rows: [[t.title], t.head, ...t.rows.map(r => r.map(txt).map(s => s.replace(/\n/g, ' — ')))], styles: { 0: 3, 1: 1 }, widths: [16, ...S.config.dias.map(() => 30)], freeze: 2 });
  } else for (const t of tabs) sheets.push({ name: t.sheet || t.title, rows: [[t.title], t.head, ...t.rows.map(r => r.map(c => typeof c === 'number' ? c : (c && typeof c === 'object' && typeof c.t === 'number') ? c.t : txt(c).replace(/\n/g, ' — ')))], styles: { 0: 3, 1: 1 }, widths: t.head.map((h, i) => i === 0 ? 30 : k === 'quadro' ? 16 : Math.max(12, Math.min(60, String(h).length + 10))), freeze: 2 });
  return XLSX.write(sheets);
}
const nomeArq = (k, f) => ('Horario_' + REL[k] + (f ? '_' + (M.turma[f]?.nome || M.prof[f]?.nome || '') : '')).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/_+$/, '');
const filtroRel = k => k === 'turmas' ? $('rT')?.value : k === 'profs' ? $('rP')?.value : '';
ACT.pdf = d => { if (!S.turmas.length) return toast('Sem dados.'); baixar(nomeArq(d.r, filtroRel(d.r)) + '.pdf', gerarPDF(d.r, filtroRel(d.r)), 'application/pdf'); };
ACT.xls = d => { if (!S.turmas.length) return toast('Sem dados.'); baixar(nomeArq(d.r, filtroRel(d.r)) + '.xlsx', gerarXLS(d.r, filtroRel(d.r)), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); };
ACT.exportDados = () => ACT.xls({ r: 'dados' });
ACT.backup = () => baixar('backup_quadro_horarios_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(S), 'application/json');
ACT.ver = d => {
  const tabs = relDados(d.r, filtroRel(d.r));
  $('prev').innerHTML = `<div class="card"><div class="row"><h2>${REL[d.r]}</h2><span class="sp"></span><button class="btn sm" data-act="copiarRel" data-r="${d.r}">Copiar como tabela</button></div>` + tabs.map(t => `<h3 style="margin-top:14px">${E(t.title)}</h3>${t.subtitle ? `<p class="hint">${E(t.subtitle)}</p>` : ''}<div class="tbl" style="margin-top:6px"><table><thead><tr>${t.head.map(h => `<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(c => { const o = c && typeof c === 'object' ? c : { t: c }; return `<td style="${o.fill ? `background:${o.fill};` : ''}${o.color ? `color:${o.color};` : ''}${o.bold ? 'font-weight:600;' : ''}font-size:12.5px">${E(String(o.t ?? '')).replace(/\n/g, '<br><small>') }</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`).join('') + '</div>';
  $('prev').scrollIntoView({ behavior: 'smooth' });
};
ACT.copiarRel = async d => { const tabs = relDados(d.r, filtroRel(d.r)); const s = tabs.map(t => t.title + '\n' + t.head.join('\t') + '\n' + t.rows.map(r => r.map(txt).map(x => x.replace(/\n/g, ' — ')).join('\t')).join('\n')).join('\n\n'); try { await navigator.clipboard.writeText(s); toast('Copiado. Cole no Excel com Ctrl+V.'); } catch (e) { toast('O navegador bloqueou a cópia.'); } };

/* ---------------- CONFIGURAÇÕES ---------------- */
VIEWS.ajustes = () => {
  const c = S.config, todos = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  return `<div class="top"><div><h1>Configurações</h1><p>Dados da escola, dias letivos, horários de cada turno e preferências do gerador.</p></div><button class="btn pri" data-act="salvaCfg">Salvar configurações</button></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
  <div class="card grid"><h2>Escola</h2><label class="f">Nome da escola<input type="text" id="cEsc" value="${E(c.escola)}"></label><label class="f">Ano letivo<input type="number" id="cAno" value="${c.ano || ''}" style="width:120px"></label>
   <div><b style="font-size:13px">Dias letivos</b><div class="row" style="margin-top:6px">${todos.map(d => `<label class="row" style="gap:4px"><input type="checkbox" class="cDia" value="${d}" ${c.dias.includes(d) ? 'checked' : ''}>${d}</label>`).join('')}</div></div></div>
  <div class="card grid"><h2>Horários dos turnos</h2><p class="hint">Início de cada aula, separados por vírgula. Professores que dão aula em turnos diferentes só têm conflito quando os horários coincidem.</p>
   ${Object.entries(c.turnos).map(([k, t]) => `<div class="grid" style="gap:6px"><label class="f">${E(t.nome)} — início de cada aula (${t.horarios.length} aulas)<input type="text" class="cTur" data-k="${k}" value="${E(t.horarios.join(', '))}"></label><label class="f">Intervalos do ${E(t.nome.toLowerCase())}<input type="text" class="cInt" data-k="${k}" value="${E((t.intervalos || []).map(iv => iv.ini + '-' + iv.fim + ' ' + iv.nome).join('; '))}" placeholder="09:25-09:45 Recreio; 12:10-13:10 Almoço"></label></div>`).join('')}
   <p class="hint">Turmas com menos aulas por dia usam só os primeiros horários do turno (ex.: regular com 6 aulas termina antes do almoço; EMTI com 7 usa também a aula das 13:10).</p></div>
  <div class="card grid"><h2>Preferências do gerador</h2>
   <label class="f">Máximo de aulas da mesma disciplina no mesmo dia<input type="number" id="cMax" min="1" max="6" value="${c.prefs.maxMesmaDiscDia}"></label>
   <label class="row"><input type="checkbox" id="cAC" ${c.acFora !== false ? 'checked' : ''}> Atividades complementares ficam fora da grade (vale para as próximas importações)</label>
   <label class="row"><input type="checkbox" id="cEFN" ${c.efNoturnoFora !== false ? 'checked' : ''}> Educação Física não tem horário nas turmas do noturno (vale para as próximas importações)</label>
   <label class="row"><input type="checkbox" id="cDupla" ${c.prefs.permitirDupla !== false ? 'checked' : ''}> Permitir aula dupla (duas seguidas da mesma disciplina)</label>
   <p class="hint">Regras obrigatórias (sempre respeitadas): professor em uma turma por vez, disponibilidade do professor, quantidade de aulas de cada disciplina, aulas por dia da turma. As preferências acima e “evitar janelas” entram como penalidade.</p></div>
  ${WEB ? `<div class="card grid"><h2>Minha senha</h2><p class="hint">Conectado como <b>${E(Auth.eu?.nome)}</b> (${E(Auth.eu?.usuario)}).</p><div class="row"><button class="btn" data-act="minhaSenha">Trocar minha senha</button></div></div>` : ''}
  ${WEB && Auth.eu?.papel === 'admin' ? `<div class="card grid" style="grid-column:1/-1"><div class="row"><h2>Usuários com acesso</h2><span class="sp"></span><button class="btn pri sm" data-act="editUsu">Novo usuário</button></div><p class="hint">Cada pessoa entra com usuário e senha. No primeiro acesso, o sistema pede para ela criar a própria senha. Administradores também gerenciam usuários.</p><div id="listaUsu" class="muted">Carregando…</div></div>` : ''}
  <div class="card grid"><h2>Dados</h2><p class="hint">${WEB ? 'Os dados ficam no servidor da escola (Supabase) e aparecem para todos os usuários, em qualquer computador ou celular.' : P.db ? 'Os dados ficam no banco de dados desta página e aparecem em qualquer dispositivo em que você abrir este link.' : 'Banco de dados indisponível nesta visualização: os dados ficam salvos só neste navegador. Faça backups.'}</p>
   <div class="row"><button class="btn" data-act="backup">Baixar backup (.json)</button><button class="btn" data-act="escolherArq">Restaurar backup</button><button class="btn danger" data-act="apagaTudo">Apagar todos os dados</button></div></div>
  </div>`;
};
VIEWS.ajustes.after = () => { if (WEB && Auth.eu?.papel === 'admin') carregaUsuarios(); };
let USUS = [];
async function carregaUsuarios() {
  const el = $('listaUsu'); if (!el) return;
  try { USUS = await rpc('quadro_usuarios_lista', { p_token: Auth.token }) || []; }
  catch (e) { el.textContent = msgErro(e); return; }
  el.className = '';
  el.innerHTML = `<div class="tbl"><table class="stack"><thead><tr><th>Nome</th><th>Usuário</th><th>Papel</th><th>Situação</th><th></th></tr></thead><tbody>${USUS.map(u => `<tr><td>${E(u.nome)}</td><td>${E(u.usuario)}</td><td>${u.papel === 'admin' ? 'Administrador' : 'Editor'}</td><td>${u.ativo ? '<span class="tag ok">ativo</span>' : '<span class="tag">bloqueado</span>'}</td><td><button class="btn sm" data-act="editUsu" data-id="${u.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
}
ACT.editUsu = d => {
  const u = d.id ? USUS.find(x => String(x.id) === d.id) : { nome: '', usuario: '', papel: 'editor', ativo: true };
  drawer(`<div class="row"><h2>${d.id ? 'Editar usuário' : 'Novo usuário'}</h2><span class="sp"></span><button class="btn sm ghost" data-x>Fechar</button></div>
  <div class="grid" style="margin-top:14px"><label class="f">Nome<input type="text" id="uN" value="${E(u.nome)}"></label>
  <label class="f">Usuário (para entrar)<input type="text" id="uU" value="${E(u.usuario)}" autocapitalize="none" placeholder="ex.: maria.silva"></label>
  <label class="f">Papel<select id="uP"><option value="editor" ${u.papel === 'editor' ? 'selected' : ''}>Editor — monta e edita o quadro</option><option value="admin" ${u.papel === 'admin' ? 'selected' : ''}>Administrador — também gerencia usuários</option></select></label>
  <label class="row"><input type="checkbox" id="uA" ${u.ativo ? 'checked' : ''}> Acesso ativo</label>
  <label class="f">${d.id ? 'Nova senha provisória (deixe vazio para manter)' : 'Senha provisória'}<input type="text" id="uS" autocomplete="off" placeholder="mínimo 6 caracteres"></label>
  <p class="hint">Passe o usuário e a senha provisória para a pessoa. No primeiro acesso ela cria a própria senha.</p></div>
  <div class="row" style="margin-top:16px">${d.id && String(d.id) !== String(USUS.find(x => x.usuario === Auth.eu.usuario)?.id) ? `<button class="btn danger" data-act="delUsu" data-id="${d.id}">Excluir</button>` : ''}<span class="sp"></span><button class="btn" data-x>Cancelar</button><button class="btn pri" data-act="salvaUsu" data-id="${d.id || ''}">Salvar</button></div>`);
};
ACT.salvaUsu = async d => {
  const usu = $('uU').value.trim().toLowerCase();
  if (!/^[a-z0-9._-]{3,40}$/.test(usu)) return toast('Usuário: de 3 a 40 letras minúsculas, números, ponto, hífen ou sublinhado, sem espaços.');
  if (!d.id && $('uS').value.length < 6) return toast('Defina uma senha provisória com pelo menos 6 caracteres.');
  try { await rpc('quadro_salvar_usuario', { p_token: Auth.token, p_id: d.id ? +d.id : null, p_usuario: usu, p_nome: $('uN').value, p_papel: $('uP').value, p_senha: $('uS').value || null, p_ativo: $('uA').checked }); fecha(); toast('Usuário salvo.'); carregaUsuarios(); }
  catch (e) { toast(msgErro(e), 5000); }
};
ACT.delUsu = d => confirma('Excluir este usuário? Ele perde o acesso imediatamente.', async () => { try { await rpc('quadro_excluir_usuario', { p_token: Auth.token, p_id: +d.id }); fecha(); toast('Usuário excluído.'); carregaUsuarios(); } catch (e) { toast(msgErro(e)); } }, 'Excluir', true);
ACT.minhaSenha = () => {
  modal(`<h2>Trocar minha senha</h2><form id="fMinha" class="grid" style="margin-top:12px"><label class="f">Senha atual<input type="password" id="mA" required></label><label class="f">Nova senha<input type="password" id="mN" required></label><label class="f">Repita a nova senha<input type="password" id="mR" required></label><p id="mMsg" style="color:var(--bad);min-height:20px;margin:0"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri">Salvar</button></div></form>`);
  $('fMinha').onsubmit = async ev => { ev.preventDefault(); if ($('mN').value !== $('mR').value) return $('mMsg').textContent = 'As senhas não conferem.'; try { await rpc('quadro_trocar_senha', { p_token: Auth.token, p_atual: $('mA').value, p_nova: $('mN').value }); fecha(); toast('Senha alterada.'); } catch (e) { $('mMsg').textContent = msgErro(e); } };
};
ACT.salvaCfg = () => {
  const c = S.config, dias = [...document.querySelectorAll('.cDia:checked')].map(x => x.value);
  if (!dias.length) return toast('Escolha pelo menos um dia letivo.');
  const tur = {}; for (const el of document.querySelectorAll('.cTur')) { const hs = el.value.split(/[,;\s]+/).map(s => s.trim()).filter(Boolean); if (!hs.length || hs.some(h => !/^\d{1,2}[:h]\d{2}$/.test(h))) return toast(`Horários inválidos em ${c.turnos[el.dataset.k].nome}. Use o formato 07:00, 07:50…`); tur[el.dataset.k] = hs.map(h => h.replace('h', ':').padStart(5, '0')); }
  snap();
  c.escola = $('cEsc').value.trim() || c.escola; c.ano = +$('cAno').value || c.ano; c.dias = dias;
  for (const [k, hs] of Object.entries(tur)) c.turnos[k].horarios = hs;
  for (const el of document.querySelectorAll('.cInt')) { const ivs = []; for (const part of el.value.split(';').map(x => x.trim()).filter(Boolean)) { const m = /^(\d{1,2}[:h]\d{2})\s*[-–a]+\s*(\d{1,2}[:h]\d{2})\s*(.*)$/i.exec(part); if (!m) return toast(`Intervalo inválido: “${part}”. Use o formato 09:25-09:45 Recreio.`); const f = h => h.replace('h', ':').padStart(5, '0'); ivs.push({ ini: f(m[1]), fim: f(m[2]), nome: m[3].trim() || 'Intervalo' }); } c.turnos[el.dataset.k].intervalos = ivs; }
  c.prefs.maxMesmaDiscDia = Math.max(1, +$('cMax').value || 2); c.prefs.permitirDupla = $('cDupla').checked; c.acFora = $('cAC').checked; c.efNoturnoFora = $('cEFN').checked;
  S.turmas.forEach(t => { const max = c.turnos[t.turno]?.horarios.length || t.aulasDia; if (t.aulasDia > max) t.aulasDia = max; });
  mudou('config', 'turmas'); render(); toast('Configurações salvas.');
};
ACT.apagaTudo = () => confirma('Apagar professores, turmas, disciplinas, atribuições e a grade? Esta ação não pode ser desfeita (baixe um backup antes).', () => { const cfg = S.config; S = Store.vazio(cfg); UI.undo = []; mudou(...DOCS); location.hash = '#painel'; render(); toast('Dados apagados.'); }, 'Apagar tudo', true);

/* ---------------- início ---------------- */
if (window.__TEST) window.__T = { gerarPDF, gerarXLS, relDados, get S() { return S; } };
(async () => { await P.load(); recalc(); render(); if (UI.migrou) { P.mark(...DOCS); toast(`As atividades complementares (${UI.migrou} disciplinas) saíram da grade. Gere o horário de novo.`, 7000); } if (UI.migrouEF) { P.mark(...DOCS); toast(`Educação Física saiu do noturno (${UI.migrouEF} turmas). Ela não tem horário nas turmas da noite.`, 7000); } })();
}

</script>
